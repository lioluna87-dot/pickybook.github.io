<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickybook</title>
    <style>
        :root {
            --bg-color: #fcfbfe;
            --card-bg: #ffffff;
            --text-main: #333333;
            --purple-point: #8E65B0;
            --blue-point: #5B88CE;
            --red-point: #E42535;
            --shadow-color: rgba(142, 101, 176, 0.08);
            --shadow-hover: rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        .main-header {
            margin-bottom: 50px;
        }

        .main-logo {
            max-width: 320px;
            width: 100%;
            height: auto;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .main-logo:hover {
            transform: scale(1.02);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        .links-wrapper {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: stretch;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .card-link {
            flex: 1;
            min-width: 280px;
            max-width: 380px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px 30px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 10px 30px var(--shadow-color);
            border: 1px solid rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .card-link:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px var(--shadow-hover);
        }

        .card-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            transition: background 0.3s ease;
        }

        .card-daseol::before { background: var(--blue-point); }
        .card-birosso::before { background: var(--red-point); }

        .sub-logo {
            max-width: 180px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 25px;
            transition: transform 0.3s ease;
        }

        .card-link:hover .sub-logo {
            transform: scale(1.05);
        }

        .btn-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .card-daseol .btn-label {
            background-color: #f0f5ff;
            color: var(--blue-point);
        }

        .card-daseol:hover .btn-label {
            background-color: var(--blue-point);
            color: #ffffff;
        }

        .card-birosso .btn-label {
            background-color: #fff0f2;
            color: var(--red-point);
        }

        .card-birosso:hover .btn-label {
            background-color: var(--red-point);
            color: #ffffff;
        }

        .arrow {
            font-size: 1.1rem;
            transition: transform 0.3s ease;
        }

        .card-link:hover .arrow {
            transform: translateX(4px);
        }

        footer {
            margin-top: 60px;
            font-size: 0.85rem;
            color: #aaa;
        }

        @media (max-width: 600px) {
            .links-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .card-link {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="main-header">
            <img src="Logo.png" alt="Pickybook 로고" class="main-logo">
            <p class="subtitle">마음에 드는 이야기를 PICK 하다</p>
        </header>

        <main class="links-wrapper">
            <a href="daseol.html" class="card-link card-daseol" title="다설 페이지로 이동">
                <img src="Logo_다설.png" alt="다설 로고" class="sub-logo">
                <span class="btn-label">
                    다설 보러가기 <span class="arrow">&rarr;</span>
                </span>
            </a>

            <a href="birosso.html" class="card-link card-birosso" title="비로소 페이지로 이동">
                <img src="Logo_B-rosso.png" alt="비로소 로고" class="sub-logo">
                <span class="btn-label">
                    비로소 보러가기 <span class="arrow">&rarr;</span>
                </span>
            </a>
        </main>

        <footer>
            <p>&copy; Pickybook. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
